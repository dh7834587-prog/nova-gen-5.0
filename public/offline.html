<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05040c" />
    <title>NOVA GEN 5.0 · Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(120% 100% at 50% 0%, #150c33 0%, #07051a 45%, #03020a 100%);
        color: #ece9ff;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 460px;
        width: 100%;
        padding: 32px;
        border-radius: 22px;
        background: rgba(18, 14, 40, 0.86);
        border: 1px solid rgba(147, 112, 255, 0.28);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        text-align: center;
      }
      .mark {
        width: 62px;
        height: 62px;
        margin: 0 auto 18px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, #8b5cf6, #5b21b6 70%);
        box-shadow: 0 0 32px rgba(139, 92, 246, 0.55);
      }
      .mark span {
        width: 22px;
        height: 22px;
        border-radius: 8px;
        background: #f4f0ff;
        box-shadow: 0 0 18px rgba(244, 240, 255, 0.8);
      }
      h1 {
        font-size: 1.32rem;
        margin: 0 0 10px;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0 0 22px;
        line-height: 1.6;
        color: #b9b2e0;
        font-size: 0.94rem;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 12px;
        background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      small {
        display: block;
        margin-top: 18px;
        color: #7f78a8;
        font-size: 0.78rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span></span></div>
      <h1>You are offline</h1>
      <p>
        NOVA GEN 5.0 needs a connection to reach your private workspace, AI assistant and saved records.
        Nothing was lost — reconnect and try again.
      </p>
      <a href="/app">Retry connection</a>
      <small>NOVA GEN 5.0 · offline shell</small>
    </main>
  </body>
</html>
